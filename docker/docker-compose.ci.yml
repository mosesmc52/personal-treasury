services:
  personal-treasury:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${IMAGE_NAME:-ghcr.io/mosesmc52/personal-treasury}:${TAG:-latest}
    environment:
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_ACCESS_TOKENS_JSON: ${PLAID_ACCESS_TOKENS_JSON}
      AWS_SES_REGION_NAME: ${AWS_SES_REGION_NAME}
      AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID}
      AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY}
      FROM_ADDRESS: ${FROM_ADDRESS}
      TO_ADDRESSES: ${TO_ADDRESSES}
      SPACES_KEY: ${SPACES_KEY}
      SPACES_SECRET: ${SPACES_SECRET}
      SPACES_BUCKET: ${SPACES_BUCKET}
      SPACES_REGION: ${SPACES_REGION:-nyc3}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:-https://nyc3.digitaloceanspaces.com}
      SPACES_CDN_BASE: ${SPACES_CDN_BASE:-}
      ALLOCATION_CONFIG_SPACES_KEY: ${ALLOCATION_CONFIG_SPACES_KEY:-allocation.yaml}
