name: Build & Push Personal Treasury Image

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build_push:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      PLAID_ENV: ${{ vars.PLAID_ENV || 'sandbox' }}
      PLAID_ACCESS_TOKENS_JSON: ${{ secrets.PLAID_ACCESS_TOKENS_JSON }}
      AWS_SES_REGION_NAME: ${{ vars.AWS_SES_REGION_NAME }}
      AWS_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
      AWS_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
      FROM_ADDRESS: ${{ secrets.FROM_ADDRESS }}
      TO_ADDRESSES: ${{ secrets.TO_ADDRESSES }}
      SPACES_KEY: ${{ secrets.SPACES_KEY }}
      SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
      SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
      SPACES_REGION: ${{ vars.SPACES_REGION || 'nyc3' }}
      SPACES_ENDPOINT: ${{ vars.SPACES_ENDPOINT || 'https://nyc3.digitaloceanspaces.com' }}
      ALLOCATION_CONFIG_SPACES_KEY: ${{ vars.ALLOCATION_CONFIG_SPACES_KEY || 'allocation.yaml' }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + Push (latest)
        run: |
          TAG=${GITHUB_SHA} docker compose -f docker/docker-compose.ci.yml build
          TAG=${GITHUB_SHA} docker compose -f docker/docker-compose.ci.yml push

          TAG=latest docker compose -f docker/docker-compose.ci.yml build
          TAG=latest docker compose -f docker/docker-compose.ci.yml push
